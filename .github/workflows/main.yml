name: main
on:
    workflow_dispatch:
    push:
        branches:
            - master

jobs:
    plan:
        name: plan
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        runs-on: blacksmith-2vcpu-ubuntu-2404
        outputs:
            lines: ${{ steps.plan.outputs.lines }}
        steps:
            - name: pull repository
              uses: actions/checkout@v6
              id: repository

            - name: install go
              id: go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: plan the stale lines
              id: plan
              run: |
                  go run ./scripts plan ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} >> $GITHUB_OUTPUT
              env:
                  CONTAINER_REGISTRY_TOKEN: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}
                  CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}

    deploy:
        name: ${{ matrix.line }}
        needs: [plan]
        if: needs.plan.outputs.lines != '[]'
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 360
        strategy:
            max-parallel: 8
            matrix:
                line: ${{ fromJSON(needs.plan.outputs.lines) }}
        steps:
            - name: pull repository
              uses: actions/checkout@v6
              id: repository

            - name: setup docker builder
              uses: docker/setup-buildx-action@v4

            - name: install go
              id: go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: build and push the docker container image
              id: build
              run: |
                  go run ./scripts build ${{ matrix.line }}
              env:
                  CONTAINER_REGISTRY_TOKEN: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}
                  CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
                  DOCKER_REGISTRY_TOKEN: ${{ secrets.DOCKER_REGISTRY_TOKEN }}
                  DOCKER_REGISTRY_USERNAME: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
                  QUAY_REGISTRY_TOKEN: ${{ secrets.QUAY_REGISTRY_TOKEN }}
                  QUAY_REGISTRY_USERNAME: ${{ secrets.QUAY_REGISTRY_USERNAME }}
